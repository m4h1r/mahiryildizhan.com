<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Bağlantı yok</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: -apple-system, "Avenir Next", "Segoe UI", sans-serif;
            background: #fbfbfd;
            color: #111214;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0f1115; color: #f4f5f7; }
        }
        .card { max-width: 32rem; text-align: center; }
        h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 0.75rem; }
        p { margin: 0; color: #86868b; font-size: 0.95rem; }
        button {
            margin-top: 1.5rem;
            border: 1px solid #0071e3;
            background: #0071e3;
            color: #fff;
            border-radius: 999px;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>İnternet bağlantısı yok</h1>
        <p>Bu sayfayı görüntülemek için bir bağlantı gerekiyor. Bağlantın geri geldiğinde tekrar dene.</p>
        <button type="button" onclick="location.reload()">Tekrar Dene</button>
    </div>
</body>
</html>
